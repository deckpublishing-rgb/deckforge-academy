<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DeckForge Academy</title>
<style>
:root{--bg:#fff;--surface:#fff7ed;--text:#1c1917;--muted:#57534e;--accent:#ea580c;--accent-t:#fff;--line:#fed7aa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--surface:#292524;--text:#fafaf9;--muted:#d6d3d1;--accent:#fb923c;--accent-t:#1c1917;--line:#44403c}}
:root[data-theme="dark"]{--bg:#1c1917;--surface:#292524;--text:#fafaf9;--muted:#d6d3d1;--accent:#fb923c;--accent-t:#1c1917;--line:#44403c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:20px;color:var(--accent);text-decoration:none}
.logo span{color:var(--text)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-t);border:0;border-radius:10px;padding:12px 20px;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer}
.btn.alt{background:transparent;color:var(--accent);border:2px solid var(--accent)}
main{max-width:860px;margin:0 auto;padding:0 20px 40px}
.hero{padding:44px 0 28px;text-align:center}
.hero h1{font-size:clamp(30px,8vw,48px);line-height:1.1;margin:0 0 14px}
.hero h1 em{color:var(--accent);font-style:normal}
.hero p{color:var(--muted);font-size:18px;max-width:560px;margin:0 auto 22px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:18px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{margin:0 0 6px;font-size:17px}
.card p{margin:0;color:var(--muted);font-size:15px}
h2{font-size:24px;margin:34px 0 10px}
.mod{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.num{background:var(--accent);color:var(--accent-t);border-radius:50%;width:30px;height:30px;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px}
.login{max-width:380px;margin:50px auto}
label{display:block;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.note{font-size:13px;color:var(--muted);margin-top:14px}
.lessons{display:grid;gap:10px;margin-top:14px}
.lesson{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;color:var(--text);font-size:16px;width:100%;cursor:pointer}
.lesson small{color:var(--muted)}
.player{background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:30px 16px;text-align:center;color:var(--muted);margin-top:16px}
.bonus{border-color:var(--accent)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px}
[hidden]{display:none!important}
.tog{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:16px;cursor:pointer;color:var(--text)}
.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vid{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;margin-top:16px;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.lesson.on{border-color:var(--accent);border-width:2px}
.mh{font-size:18px;margin:22px 0 4px}
.sm{padding:8px 12px;font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.pills span{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.band{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center;margin-top:26px}
.band h3{margin:0 0 6px;font-size:20px}.band p{margin:0;color:var(--muted)}
details{border-bottom:1px solid var(--line);padding:12px 0}
summary{font-weight:700;cursor:pointer}
details p{color:var(--muted);margin:8px 0 0}
.vid.ph{background:linear-gradient(135deg,#1c1917,#9a3412)}.phi{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;text-align:center;padding:16px;font-weight:600}.play{width:64px;height:64px;border-radius:50%;background:#ea580c;display:grid;place-items:center;font-size:26px;padding-left:4px}.phn{opacity:.9;font-size:15px}
.prog{margin:6px 0 16px}.prog span{font-size:14px;color:var(--muted)}
.pbar{height:10px;background:var(--surface);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}.pbar i{display:block;height:100%;background:var(--accent)}
.acc{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;background:var(--bg)}
.acch{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:0;padding:14px;color:var(--text);font-size:16px;text-align:left;cursor:pointer}
.acch .t{flex:1;display:flex;flex-direction:column}.acch small{color:var(--muted);font-weight:400}.chev{color:var(--accent);font-size:18px}
.li{display:flex;align-items:center;gap:12px;padding:14px;border-top:1px solid var(--line);color:var(--text);text-decoration:none}
.li .lt{flex:1}.li small{color:var(--accent)}
.ck{width:22px;height:22px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:13px;flex:none;color:var(--accent-t)}.ck.on{background:var(--accent);border-color:var(--accent)}
.status{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.badge{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:600}.badge.on{border-color:var(--accent);color:var(--accent)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.star{background:none;border:0;font-size:30px;color:var(--accent);cursor:pointer;padding:2px}
textarea{width:100%;margin-top:10px;padding:12px;font-size:16px;font-family:inherit;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.ann{background:var(--accent);color:var(--accent-t);border-radius:12px;padding:12px 16px;margin:16px 0 0;font-weight:600}.acts2{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
</style>
</head>

<div id="app"></div>

<script id="data" type="application/json">{"modules": [{"id": "m1", "title": "Amazon KDP", "lessons": [{"id": "l1", "title": "Introduction to Amazon KDP", "yt": ""}, {"id": "l2", "title": "Setting up your account", "yt": ""}, {"id": "l3", "title": "Formatting your manuscript", "yt": ""}]}, {"id": "m2", "title": "Google Play Books", "lessons": [{"id": "l4", "title": "Introduction to Google Play Books", "yt": ""}, {"id": "l5", "title": "Setting up your account", "yt": ""}]}, {"id": "m3", "title": "Barnes & Noble Press", "lessons": [{"id": "l6", "title": "Introduction to Barnes & Noble Press", "yt": ""}, {"id": "l7", "title": "Setting up your account", "yt": ""}]}, {"id": "m4", "title": "Audiobooks with Spotify for Authors", "lessons": [{"id": "l8", "title": "Introduction to audiobooks", "yt": ""}, {"id": "l9", "title": "Setting up your account", "yt": ""}]}, {"id": "m5", "title": "Bonus: AI-Powered Publishing Tools", "lessons": [{"id": "l10", "title": "Getting started with the tools", "yt": ""}]}]}</script>
<script>
var PUB=JSON.parse(document.getElementById("data").textContent),D={modules:[]},cur=null,app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function yid(u){var m=String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/);return m?m[1]:null}
function uid(){return"x"+Math.random().toString(36).slice(2,8)}
function setTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("t",t)}catch(e){}}
try{var st=localStorage.getItem("t");if(st)setTheme(st)}catch(e){}
function isDark(){var t=document.documentElement.getAttribute("data-theme");return t?t==="dark":matchMedia("(prefers-color-scheme:dark)").matches}
var sb=supabase.createClient(DECKFORGE_CONFIG.SUPABASE_URL,DECKFORGE_CONFIG.SUPABASE_ANON_KEY,{auth:{storage:window.sessionStorage}}),QI=0,ANN=null,U=null,PR=null,MODE="in",MSG="",ready=false,P={done:{},rev:{}},OPEN={};
function $(i){return document.getElementById(i)}
async function loadAll(){var s=(await sb.auth.getSession()).data.session;U=s?s.user:null;PR=null;if(U){var r=await sb.from("profiles").select("status,full_name").eq("id",U.id).maybeSingle();PR=r.data;if(PR&&PR.status==="approved"){var m=await sb.from("modules").select("id,title,position").order("position"),l=await sb.from("lessons").select("id,module_id,title,youtube_url,position").order("position");D.modules=(m.data||[]).map(function(x){return{id:x.id,title:x.title,lessons:(l.data||[]).filter(function(y){return y.module_id===x.id}).map(function(y){return{id:y.id,title:y.title,yt:y.youtube_url}})}});var p=await sb.from("progress").select("lesson_id").eq("user_id",U.id);P.done={};(p.data||[]).forEach(function(x){P.done[x.lesson_id]=1});var rv=await sb.from("reviews").select("lesson_id,rating,comment").eq("user_id",U.id);P.rev={};(rv.data||[]).forEach(function(x){P.rev[x.lesson_id]={r:x.rating||0,t:x.comment||""}});var an=await sb.from("announcements").select("message").eq("active",true).order("created_at",{ascending:false}).limit(1);ANN=(!an.error&&an.data&&an.data[0])?an.data[0].message:null;QI=pickQ();if(D.modules[0]&&!Object.keys(OPEN).length)OPEN[D.modules[0].id]=true}}ready=true;render()}
async function doAuth(){var em=$("em").value.trim(),pw=$("pw").value,su=MODE==="up",m=$("am");if(!em||!pw){m.textContent="Enter your email and password.";return}if(su&&pw.length<8){m.textContent="Use at least 8 characters.";return}m.textContent="Please wait…";var r;if(su){r=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:$("fn").value.trim()}}});if(r.error){m.textContent=r.error.message;return}if(!r.data.session){MODE="in";MSG="Check your email to confirm your account, then log in.";render();return}}else{r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error){m.textContent=r.error.message;return}}MSG="";try{sessionStorage.setItem("dfl",Date.now())}catch(e){}await loadAll();if(PR&&PR.status==="approved")location.hash="#course"}
function pickQ(){var l=-1,i;try{l=+localStorage.getItem("dfq")}catch(e){}do{i=Math.floor(Math.random()*QUOTES.length)}while(i===l&&QUOTES.length>1);try{localStorage.setItem("dfq",i)}catch(e){}return i}
async function doForgot(){var em=$("em").value.trim(),m=$("am");if(!em){m.textContent="Enter your email.";return}m.textContent="Please wait…";var r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});m.textContent=r.error?r.error.message:"If that email has an account, a reset link is on its way. Check your inbox."}
async function doReset(){var p=$("np").value,m=$("am");if(p.length<8){m.textContent="Use at least 8 characters.";return}var r=await sb.auth.updateUser({password:p});if(r.error){m.textContent=r.error.message;return}MSG="";try{sessionStorage.setItem("dfl",Date.now())}catch(e){}await loadAll();location.hash=PR&&PR.status==="approved"?"#course":"#login"}
function kick(msg){sb.auth.signOut().then(function(){U=null;PR=null;D={modules:[]};P={done:{},rev:{}};MSG=msg;MODE="in";location.hash="#login";render()})}
var IDLE=60*60*1000,MAXS=12*60*60*1000,lastAct=Date.now();
["click","keydown","touchstart","scroll"].forEach(function(ev){addEventListener(ev,function(){lastAct=Date.now()},{passive:true})});
setInterval(function(){if(!U)return;var st=+sessionStorage.getItem("dfl")||Date.now();if(Date.now()-lastAct>IDLE||Date.now()-st>MAXS)kick("You were logged out for your security. Please log in again.")},30000);
sb.auth.onAuthStateChange(function(ev){if(ev==="PASSWORD_RECOVERY"){location.hash="#reset";render()}});
function saveRev(c){var v=P.rev[c];return sb.from("reviews").upsert({user_id:U.id,lesson_id:c,rating:v.r||null,comment:v.t,updated_at:new Date().toISOString()})}
function view(){var h=(location.hash||"#home").slice(1);if(h.indexOf("lesson-")===0)return"lesson";return["home","login","course","terms","reset"].indexOf(h)<0?"home":h}
function curId(){return(location.hash||"").slice(8)}
function header(v){return'<header><a class="logo" href="#home">Deck<span>Forge</span> Academy</a><div class="hr"><button class="tog" data-a="theme" aria-label="Switch light or dark mode">'+(isDark()?"☀️":"🌙")+'</button>'+(U?'<button class="btn alt sm" data-a="out">Log out</button>':'<a class="btn alt sm" href="#login">Log in</a>')+'</div></header>'}
function home(){var mods=PUB.modules.map(function(m,i){return'<div class="mod"><div class="num">'+(i+1)+'</div><div><b>'+esc(m.title)+'</b></div></div>'}).join("");return`<div class="hero"><h1>Publish your book <em>everywhere</em> your readers are</h1><p>A complete, step-by-step course on self-publishing wide, from your first upload to ebooks, paperbacks and audiobooks on the biggest platforms.</p><a class="btn" href="#login">Student login</a><div class="pills"><span>Amazon KDP</span><span>Google Play Books</span><span>Barnes &amp; Noble</span><span>Spotify for Authors</span></div></div>
<h2>Why publish wide?</h2><div class="grid"><div class="card"><h3>📚 More readers</h3><p>Every store has its own audience. Being on more shelves means more chances to be found.</p></div><div class="card"><h3>🛡️ Less risk</h3><p>Stop depending on a single platform for your income and your readership.</p></div><div class="card"><h3>🎧 Every format</h3><p>Ebook, paperback and audiobook, all planned and published the right way.</p></div></div>
<h2>Inside the course</h2><div>${mods}</div>
<h2>How it works</h2><div class="grid"><div class="card"><h3>1. Log in</h3><p>Use your personal student account to open the course.</p></div><div class="card"><h3>2. Learn at your pace</h3><p>Watch each lesson on your phone, tablet or computer, as often as you like.</p></div><div class="card"><h3>3. Publish with confidence</h3><p>Follow along and get your book live on each platform.</p></div></div>
<div class="band"><h3>Smart tools included</h3><p>Your course comes with AI-powered tools to help you write and publish faster.</p></div>
<h2>Who it’s for</h2><div class="grid"><div class="card"><p>First-time authors ready to publish their book.</p></div><div class="card"><p>Authors who only sell on one platform today.</p></div><div class="card"><p>Anyone with a finished manuscript and a plan to share it with the world.</p></div></div>
<h2>Questions</h2><details><summary>Do I need any technical experience?</summary><p>No. Every lesson walks you through each step on screen.</p></details><details><summary>How do I get access?</summary><p>Log in with your personal student account to open the lessons.</p></details><details><summary>Can I learn on my phone?</summary><p>Yes. The course works on phones, tablets and computers.</p></details><details><summary>Which platforms are covered?</summary><p>Amazon KDP, Google Play Books, Barnes &amp; Noble and Spotify for Authors for audiobooks.</p></details>
<div class="band" style="margin-top:34px"><h3>Ready to get your book out there?</h3><p><a class="btn" href="#login">Start learning</a></p></div>`}
function login(){var su=MODE==="up",fg=MODE==="forgot";return'<div class="login"><h2 style="margin-top:0">'+(fg?"Reset your password":su?"Create your account":"Welcome back")+'</h2><p class="note" style="margin-top:0">'+(fg?"Enter your email and we’ll send you a reset link.":su?"Sign up and we’ll approve your access.":"Log in to continue your course.")+'</p>'+(su?'<label for="fn">Full name</label><input id="fn" autocomplete="name">':"")+'<label for="em">Email</label><input id="em" type="email" autocomplete="email">'+(fg?"":'<label for="pw">Password</label><input id="pw" type="password" autocomplete="'+(su?"new-password":"current-password")+'" placeholder="At least 8 characters">')+'<p class="note" id="am" style="min-height:22px;color:var(--accent)">'+esc(MSG)+'</p><button class="btn" style="width:100%" data-a="auth">'+(fg?"Send reset link":su?"Create account":"Log in")+'</button>'+(MODE==="in"?'<p class="note" style="text-align:center"><a href="#login" data-a="forgot" style="color:var(--accent)">Forgot password?</a></p>':"")+'<p class="note" style="text-align:center"><a href="#login" data-a="mode" style="color:var(--accent);font-weight:600">'+(fg?"Back to log in":su?"I already have an account":"New student? Create an account")+'</a></p></div>'}
function resetPage(){return'<div class="login"><h2 style="margin-top:0">Set a new password</h2><label for="np">New password</label><input id="np" type="password" autocomplete="new-password" placeholder="At least 8 characters"><p class="note" id="am" style="min-height:22px;color:var(--accent)"></p><button class="btn" style="width:100%" data-a="reset">Save password</button></div>'}
function terms(){return'<div style="padding:20px 0;max-width:680px"><h2>Terms of Service</h2><p><b>Your account.</b> Your access is personal. Do not share your login or give anyone else access to the course.</p><p><b>Course content.</b> Lessons, videos and materials are for your own learning. Do not copy, record, resell or share them.</p><p><b>Suspension.</b> We may suspend or remove access if these terms are broken.</p><p><b>No guarantees.</b> The course teaches publishing methods. We cannot guarantee sales or income, and the rules of platforms such as Amazon KDP can change.</p><p><b>Changes.</b> We may update the course and these terms from time to time.</p><h2>Privacy</h2><p><b>What we collect.</b> Your name, email, lesson progress and any reviews you write.</p><p><b>How we use it.</b> To run your account and course, and to contact you about the course. We do not sell your information.</p><p><b>Where it is stored.</b> In a secure online database service. Videos are played from YouTube, which may collect its own data.</p><p><b>Your choices.</b> You can ask us to delete your account at any time through the support contact below.</p></div>'}
function foot(){var c=DECKFORGE_CONFIG,e=c.SUPPORT_EMAIL;return'<footer><p style="margin:0 0 6px"><a href="#terms" style="color:var(--muted)">Terms &amp; Privacy</a>'+(e?' · <a href="mailto:'+esc(e)+'" style="color:var(--muted)">Contact support</a>':"")+'</p>© 2026 DeckForge Academy</footer>'}
function status(){var r=PR&&PR.status==="removed";return'<div class="login"><h2 style="margin-top:0">'+(r?"Access removed":"Waiting for approval")+'</h2><p class="note">'+(r?"Your access to the course has been removed. Please contact us for help.":"Thanks for signing up. You’ll get access as soon as your account is approved. Check back soon.")+'</p></div>'}
function guard(f){return!ready?'<p class="note" style="padding:40px 0;text-align:center">Loading…</p>':!U?login():(!PR||PR.status!=="approved")?status():f()}
var QUOTES=["Every lesson you finish is one step closer to a published book.","Your story deserves to be read. Keep going.","Small steps each day turn into a finished book.","Publishing is a skill, and you are learning it right now.","Consistency beats perfection. Show up today.","Your readers are waiting for your book.","Done is better than perfect. Publish it.","A little progress each day adds up to big results.","You don’t have to be great to start, but you have to start to be great.","Your book can change someone’s life. Keep learning.","Focus on the next lesson, not the whole mountain.","Every published author was once a beginner."];
